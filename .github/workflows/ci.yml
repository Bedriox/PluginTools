name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {path: PluginTools, persist-credentials: false}
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with: {php-version: '${{ matrix.php }}', coverage: none, tools: 'composer:v2'}
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: PluginTools
      - run: composer validate --strict
        working-directory: PluginTools
      - run: composer audit --locked
        working-directory: PluginTools
      - run: composer check
        working-directory: PluginTools
